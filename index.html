<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>猴子快跑</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; }
  body{
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:20px;
    background:#fafafa;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:22px;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    transition:background-color .8s ease;
  }
  body.night{ background:#1a1a1c; }
  body.rain{ background:#2c3341; }

  canvas{
    display:block; max-width:100%; height:auto;
    border-radius:4px;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    outline:none;
  }

  .hint{
    font-size:13px; letter-spacing:.04em;
    color:#b0b0b0; text-align:center; line-height:1.9;
    transition:color .8s ease;
  }
  body.night .hint, body.rain .hint{ color:#555; }

  .hint kbd{
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:12px; color:#8a8a8a;
    border:1px solid #e2e2e2; border-bottom-width:2px;
    border-radius:4px; padding:1px 6px; background:#fff;
    transition:all .8s ease;
  }
  body.night .hint kbd, body.rain .hint kbd{
    color:#999; border-color:#3a3a3c; background:#2a2a2c;
  }

  @media (max-width:640px){
    body{ gap:14px; padding:14px; }
    .hint{ font-size:12px; }
  }
</style>
</head>
<body>

<canvas id="game" tabindex="0"></canvas>

<p class="hint">
  <kbd>空格</kbd> 跳（空中再按=二段跳） &nbsp;·&nbsp; <kbd>↓</kbd> 蹲 &nbsp;·&nbsp; 尖刺 +100 &nbsp;·&nbsp; 香蕉 +50 &nbsp;·&nbsp; 2 香蕉 = 1 护盾
</p>

<script>
(function(){
'use strict';

/* ============================================================
   画布
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = 620, H = 220;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

canvas.width  = W * DPR;
canvas.height = H * DPR;
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(DPR, DPR);

/* ============================================================
   常量
   ============================================================ */
const GROUND_Y   = 168;
const MONKEY_X   = 56;
const MONKEY_W   = 44;
const MONKEY_H   = 54;
const CROUCH_H   = 30;

const GRAVITY    = 2400;
const JUMP_V     = 640;
const JUMP2_V    = 560;

const SPEED_START = 320;
const SPEED_MAX   = 1050;
const SPEED_STEP  = 70;

const SCORE_SPIKE  = 100;
const SCORE_BANANA = 50;

const DAY_BG   = [250,250,250];
const DAY_FG   = [ 88, 88, 94];
const NIGHT_BG = [ 24, 24, 28];
const NIGHT_FG = [210,210,216];
const RAIN_BG  = [ 46, 54, 70];
const RAIN_FG  = [200,208,220];
const BOW_BG   = [245,240,235];
const BOW_FG   = [ 92, 96,112];

const FUR      = '#8B5E3C';
const FUR_DARK = '#6B4423';
const FACE     = '#EFD5B0';
const DARK     = '#2A1A10';

const MUTATE_SCORE  = 10000;
const MUTATE_ANIM_T = 0.5;
const RESTORE_SCORE = 4777;

/* ============================================================
   状态
   ============================================================ */
let phase = 'ready';

let speed  = SPEED_START;
let score  = 0;
let hiScore = 0;

let stage = 0;
let stageTimer = 0;

let nightT  = 0;
let rainAmt = 0;
let bowAmt  = 0;

let obstacles = [];
let bananas   = [];
let popups    = [];
let clouds    = [];
let pebbles   = [];
let rainDrops = [];
let puffs     = [];

let spawnTimer   = 0;
let nextSpawn    = 1.4;
let bananaTimer  = 0;
let nextBanana   = 1.8;

let runPhase = 0;
let overTimer = 0;
let nextThunder = 1000;

let shield     = 0;
let bananaCnt  = 0;
let mutated    = false;
let mutateAnim = 1;

const monkey = { y:0, vy:0, onGround:true, jumps:0 };
const keys = { down:false };

/* ============================================================
   音效
   ============================================================ */
let audioCtx = null;
let lastThunder = 0;

function ac(){
  try {
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended'){
      const p = audioCtx.resume();
      if (p && p.catch) p.catch(function(){});
    }
    return audioCtx;
  } catch(e){ return null; }
}

function sndBanana(){
  const a = ac(); if(!a) return;
  try {
    const t = a.currentTime;
    const osc = a.createOscillator();
    const g   = a.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(988,  t);
    osc.frequency.setValueAtTime(1319, t + 0.055);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.008);
    g.gain.setValueAtTime(0.14, t + 0.055);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    osc.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t + 0.32);
  } catch(e){}
}

function sndThunder(){
  const now = performance.now();
  if (now - lastThunder < 500) return;
  lastThunder = now;

  const a = ac(); if(!a) return;
  try {
    const t = a.currentTime;
    const dur = 1.5;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d   = buf.getChannelData(0);
    for (let i=0;i<len;i++){
      const p = i / len;
      d[i] = (Math.random()*2-1) * Math.pow(1-p, 2.2);
    }
    const src = a.createBufferSource();
    src.buffer = buf;
    const flt = a.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(800, t);
    flt.frequency.exponentialRampToValueAtTime(60, t + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.34, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt); flt.connect(g); g.connect(a.destination);
    src.start(t); src.stop(t + dur);
  } catch(e){}
}

function sndScream(){
  const a = ac(); if(!a) return;
  try {
    const t = a.currentTime;
    const dur = 0.62;

    const osc = a.createOscillator();
    const g   = a.createGain();
    const flt = a.createBiquadFilter();

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(1150, t);
    osc.frequency.exponentialRampToValueAtTime(1980, t + 0.06);
    osc.frequency.exponentialRampToValueAtTime(1500, t + 0.16);
    osc.frequency.exponentialRampToValueAtTime(1050, t + 0.30);
    osc.frequency.exponentialRampToValueAtTime(620,  t + 0.46);
    osc.frequency.exponentialRampToValueAtTime(280,  t + dur);

    const lfo     = a.createOscillator();
    const lfoGain = a.createGain();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(34, t);
    lfo.frequency.linearRampToValueAtTime(18, t + dur);
    lfoGain.gain.setValueAtTime(85, t);
    lfoGain.gain.linearRampToValueAtTime(30, t + dur);
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);

    flt.type = 'bandpass';
    flt.frequency.setValueAtTime(1600, t);
    flt.frequency.exponentialRampToValueAtTime(700, t + dur);
    flt.Q.value = 1.6;

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.24, t + 0.015);
    g.gain.setValueAtTime(0.24, t + 0.18);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(flt); flt.connect(g); g.connect(a.destination);
    lfo.start(t); lfo.stop(t + dur);
    osc.start(t); osc.stop(t + dur);
  } catch(e){}
}

function sndShieldGet(){
  const a = ac(); if(!a) return;
  try {
    const t = a.currentTime;
    const notes = [523, 659, 784, 1047];
    notes.forEach(function(f, i){
      const osc = a.createOscillator();
      const g = a.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      const st = t + i * 0.06;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.13, st + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.2);
      osc.connect(g); g.connect(a.destination);
      osc.start(st); osc.stop(st + 0.22);
    });
  } catch(e){}
}

function sndShieldBreak(){
  const a = ac(); if(!a) return;
  try {
    const t = a.currentTime;
    const osc = a.createOscillator();
    const g = a.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1500, t);
    osc.frequency.exponentialRampToValueAtTime(380, t + 0.28);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    osc.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t + 0.34);
  } catch(e){}
}

function sndRoar(){
  const a = ac(); if(!a) return;
  try {
    const t = a.currentTime;
    const dur = 1.4;

    const osc = a.createOscillator();
    const g = a.createGain();
    const flt = a.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(220, t);
    osc.frequency.exponentialRampToValueAtTime(110, t + dur);
    flt.type = 'lowpass';
    flt.frequency.value = 600;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.34, t + 0.08);
    g.gain.setValueAtTime(0.34, t + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(flt); flt.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t + dur);

    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++){
      const p = i / len;
      d[i] = (Math.random()*2-1) * Math.pow(1-p, 1.4);
    }
    const src = a.createBufferSource();
    src.buffer = buf;
    const flt2 = a.createBiquadFilter();
    flt2.type = 'lowpass';
    flt2.frequency.value = 900;
    const g2 = a.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.30, t + 0.1);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt2); flt2.connect(g2); g2.connect(a.destination);
    src.start(t); src.stop(t + dur);
  } catch(e){}
}

/* ============================================================
   雨声
   ============================================================ */
let rainNode = null;

function ensureRainSound(){
  const a = ac(); if(!a) return null;
  if (rainNode) return rainNode;

  try {
    const dur = 2;
    const len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++){
      d[i] = Math.random() * 2 - 1;
    }

    const src = a.createBufferSource();
    src.buffer = buf;
    src.loop = true;

    const flt = a.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.value = 1400;
    flt.Q.value = 0.55;

    const flt2 = a.createBiquadFilter();
    flt2.type = 'highpass';
    flt2.frequency.value = 3200;

    const gHigh = a.createGain();
    gHigh.gain.value = 0.35;

    const g = a.createGain();
    g.gain.value = 0;

    src.connect(flt);
    flt.connect(g);

    src.connect(flt2);
    flt2.connect(gHigh);
    gHigh.connect(g);

    g.connect(a.destination);

    src.start(0);
    rainNode = { src: src, g: g };

    return rainNode;
  } catch(e){
    return null;
  }
}

function updateRainSound(){
  const a = ac(); if(!a) return;
  const node = ensureRainSound();
  if (!node) return;

  try {
    let target = 0;
    if (phase === 'running'){
      target = Math.max(0, Math.min(1, rainAmt)) * 0.16;
    }
    node.g.gain.setTargetAtTime(target, a.currentTime, 0.3);
  } catch(e){}
}

function stopRainSound(){
  const a = ac(); if(!a || !rainNode) return;
  try {
    rainNode.g.gain.setTargetAtTime(0, a.currentTime, 0.2);
  } catch(e){}
}

/* ============================================================
   工具
   ============================================================ */
function mixC(a,b,t){
  return [
    Math.round(a[0]+(b[0]-a[0])*t),
    Math.round(a[1]+(b[1]-a[1])*t),
    Math.round(a[2]+(b[2]-a[2])*t)
  ];
}
function rgbS(c){ return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
function pad5(n){ return String(Math.max(0,Math.floor(n))).padStart(5,'0'); }

/* ============================================================
   初始化
   ============================================================ */
function initPebbles(){
  pebbles = [];
  for(let i=0;i<44;i++){
    pebbles.push({
      x: Math.random()*(W+140),
      y: GROUND_Y + 5 + Math.random()*14,
      w: 1 + Math.floor(Math.random()*4)
    });
  }
}
function initClouds(){
  clouds = [
    { x:  90, y: 36 },
    { x: 320, y: 62 },
    { x: 520, y: 26 }
  ];
}
function loadHi(){
  try{
    const v = localStorage.getItem('monkey_hi_v8');
    if (v) hiScore = parseInt(v,10)||0;
  }catch(e){}
}
function saveHi(){
  try{ localStorage.setItem('monkey_hi_v8', String(hiScore)); }catch(e){}
}

/* ============================================================
   重置 / 结束
   ============================================================ */
function resetGame(runNow){
  speed  = SPEED_START;
  score  = 0;
  nightT = 0;
  rainAmt = 0;
  bowAmt  = 0;
  runPhase = 0;
  spawnTimer = 0;  nextSpawn  = 1.4;
  bananaTimer = 0; nextBanana = 1.8;
  overTimer = 0;
  nextThunder = 1000;
  stage = 0;
  stageTimer = 0;
  shield = 0;
  bananaCnt = 0;
  mutated = false;
  mutateAnim = 1;

  obstacles = [];
  bananas   = [];
  popups    = [];
  rainDrops = [];
  puffs     = [];

  monkey.y = 0; monkey.vy = 0; monkey.onGround = true; monkey.jumps = 0;
  keys.down = false;

  initPebbles();
  initClouds();

  stopRainSound();

  phase = runNow ? 'running' : 'ready';
}

function gameOver(){
  if (phase !== 'running') return;
  phase = 'over';
  overTimer = 0;
  sndScream();
  stopRainSound();
  const s = Math.floor(score);
  if (s > hiScore){ hiScore = s; saveHi(); }
}

function triggerMutation(){
  if (mutated) return;
  mutated = true;
  mutateAnim = 0;
  sndRoar();

  popups.push({
    x: MONKEY_X + MONKEY_W/2,
    y: GROUND_Y - MONKEY_H - 60,
    t: 0, life: 1.6,
    text: '红 温 变 异 !'
  });

  const s = Math.floor(score);
  if (s > hiScore){ hiScore = s; saveHi(); }
}

/* ============================================================
   跳跃
   ============================================================ */
function jump(){
  if (phase === 'ready'){ resetGame(true); return; }

  if (phase === 'running'){
    if (keys.down) return;

    if (monkey.onGround){
      monkey.vy = JUMP_V;
      monkey.onGround = false;
      monkey.jumps = 1;
    } else if (monkey.jumps < 2){
      monkey.vy = JUMP2_V;
      monkey.jumps = 2;
      puffs.push({
        x: MONKEY_X + MONKEY_W / 2,
        y: GROUND_Y - monkey.y - 8,
        t: 0, life: 0.35
      });
    }
    return;
  }

  if (phase === 'over' && overTimer > 0.45){
    resetGame(true);
  }
}

/* ============================================================
   生成
   ============================================================ */
function getRightmost(){
  let rightmost = null;
  for (let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    if (!rightmost || o.x + o.w > rightmost.x + rightmost.w){
      rightmost = o;
    }
  }
  return rightmost;
}

function canSpawn(newType){
  const rm = getRightmost();
  if (!rm) return true;

  const gap = (W + 30) - (rm.x + rm.w);
  let minGap = 0;
  const prev = rm.type;

  if (prev === 'spike' && newType === 'eagle')      minGap = 300;
  else if (prev === 'eagle' && newType === 'spike') minGap = 300;
  else if (prev === 'spike' && newType === 'spike') minGap = 200;
  else if (prev === 'eagle' && newType === 'eagle') minGap = 240;

  return gap >= minGap;
}

function spawnSpikes(count){
  const spikeW = 20;
  let spacing;

  if (count <= 2){
    spacing = 22;
  } else {
    spacing = 78;
  }

  for (let i=0;i<count;i++){
    obstacles.push({
      type:'spike',
      x: W + 30 + i * (spikeW + spacing),
      w: spikeW,
      h: 30 + Math.random()*8,
      passed: false
    });
  }
}

function trySpawnObstacle(){
  const r = Math.random();
  let type;

  if (score > 120 && r < 0.22){
    type = 'eagle';
  } else {
    type = 'spike';
  }

  if (!canSpawn(type)) return false;

  if (type === 'eagle'){
    obstacles.push({
      type:'eagle',
      x: W + 34,
      y: GROUND_Y - 88,
      w: 76,
      h: 64,
      flap: 0, flapT: 0,
      passed:false
    });
    sndThunder();
  } else {
    const r2 = Math.random();
    let count;
    if (score < 100)       count = 1;
    else if (score < 300)  count = r2 < 0.65 ? 1 : 2;
    else if (score < 600)  count = r2 < 0.42 ? 1 : (r2 < 0.84 ? 2 : 3);
    else                   count = r2 < 0.35 ? 1 : (r2 < 0.72 ? 2 : 3);
    spawnSpikes(count);
  }

  return true;
}

function spawnBanana(){
  for (let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    if (Math.abs(o.x - (W + 40)) < 130) return;
  }

  const bx = W + 40;
  const by = GROUND_Y - 72 - Math.random()*22;

  bananas.push({
    x: bx, y: by,
    r: 11,
    taken: false,
    bob: Math.random()*Math.PI*2
  });
}

/* ============================================================
   碰撞
   ============================================================ */
function monkeyBox(){
  const isMut = mutated;
  const crouching = keys.down && monkey.onGround;

  let w = MONKEY_W * (isMut ? 1.15 : 1);
  let h = (crouching ? CROUCH_H : MONKEY_H) * (isMut ? 1.15 : 1);

  const cx = MONKEY_X + MONKEY_W / 2;

  return {
    l: cx - w/2 + 4,
    r: cx + w/2 - 4,
    t: GROUND_Y - monkey.y - h + 10,
    b: GROUND_Y - monkey.y - 3
  };
}

function checkCollision(){
  if (phase !== 'running') return;
  const m = monkeyBox();

  for (let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    let ol, or, ot, ob;

    if (o.type === 'eagle'){
      ol = o.x + 10;  or = o.x + o.w - 10;
      ot = o.y + 10;  ob = o.y + o.h - 14;
    } else {
      ol = o.x + 5;  or = o.x + o.w - 5;
      ot = GROUND_Y - o.h + 6;  ob = GROUND_Y;
    }

    if (m.l < or && m.r > ol && m.t < ob && m.b > ot){

      if (o.type === 'spike' && shield > 0){
        shield--;
        obstacles.splice(i, 1);
        sndShieldBreak();
        popups.push({
          x: MONKEY_X + 40,
          y: GROUND_Y - monkey.y - MONKEY_H - 4,
          t: 0, life: 0.9,
          text: '护盾!'
        });
        continue;
      }

      gameOver();
      return;
    }
  }
}

/* ============================================================
   更新
   ============================================================ */
function update(dt){

  const drift = (phase === 'running' ? speed : SPEED_START) * 0.22;
  for (let i=0;i<clouds.length;i++){
    const c = clouds[i];
    c.x -= drift * dt;
    if (c.x < -90){
      c.x = W + 60 + Math.random()*220;
      c.y = 20 + Math.random()*50;
    }
  }

  for (let i=puffs.length-1;i>=0;i--){
    puffs[i].t += dt;
    if (puffs[i].t >= puffs[i].life) puffs.splice(i,1);
  }

  updateRainSound();

  if (phase === 'over'){ overTimer += dt; return; }
  if (phase === 'ready') return;

  stageTimer += dt;
  if (stageTimer >= 10){
    stageTimer -= 10;
    stage++;
    speed = Math.min(SPEED_MAX, SPEED_START + stage * SPEED_STEP);
  }

  const targetNight = Math.floor(score / 240) % 2;
  nightT += (targetNight - nightT) * Math.min(1, dt * 3.5);

  let tRain = 0, tBow = 0;
  if (score >= 3000 && score < 4000)                tRain = 1;
  else if (score >= 4000 && score < RESTORE_SCORE)  tBow  = 1;

  rainAmt += (tRain - rainAmt) * Math.min(1, dt * 1.8);
  bowAmt  += (tBow  - bowAmt)  * Math.min(1, dt * 1.8);

  if (score >= nextThunder){
    sndThunder();
    nextThunder += 1000;
  }

  if (score >= MUTATE_SCORE && !mutated){
    triggerMutation();
  }

  if (mutated && mutateAnim < 1){
    mutateAnim = Math.min(1, mutateAnim + dt / MUTATE_ANIM_T);
  }

  runPhase += dt * (speed / 55);
  if (runPhase > 1) runPhase -= 1;

  if (!monkey.onGround){
    monkey.vy -= GRAVITY * dt;
    monkey.y  += monkey.vy * dt;
    if (monkey.y <= 0){
      monkey.y = 0; monkey.vy = 0; monkey.onGround = true; monkey.jumps = 0;
    }
  }

  for (let i=0;i<pebbles.length;i++){
    const p = pebbles[i];
    p.x -= speed * dt;
    if (p.x < -8){
      p.x += W + 60 + Math.random()*140;
      p.y  = GROUND_Y + 5 + Math.random()*14;
      p.w  = 1 + Math.floor(Math.random()*4);
    }
  }

  spawnTimer += dt;
  if (spawnTimer >= nextSpawn){
    if (trySpawnObstacle()){
      spawnTimer = 0;
      const base = 0.68 + Math.random()*0.55;
      const spdF = 340 / Math.max(300, speed);
      nextSpawn = base * spdF + 0.18;
    }
  }

  bananaTimer += dt;
  if (bananaTimer >= nextBanana){
    spawnBanana();
    bananaTimer = 0;
    nextBanana = 1.6 + Math.random()*1.4;
  }

  for (let i=obstacles.length-1;i>=0;i--){
    const o = obstacles[i];
    o.x -= speed * dt;

    if (o.type === 'eagle'){
      o.flapT += dt;
      if (o.flapT > 0.14){ o.flapT = 0; o.flap ^= 1; }
    }

    if (!o.passed && o.x + o.w < MONKEY_X + 8){
      o.passed = true;
      if (o.type === 'spike'){
        score += SCORE_SPIKE;
        popups.push({
          x: o.x + o.w/2,
          y: GROUND_Y - o.h - 20,
          t: 0, life: 0.85,
          text: '+' + SCORE_SPIKE
        });
      }
    }

    if (o.x + o.w < -60) obstacles.splice(i,1);
  }

  const m = monkeyBox();
  for (let i=bananas.length-1;i>=0;i--){
    const b = bananas[i];
    b.x -= speed * dt;
    b.bob += dt * 4;

    const bx = b.x, by = b.y + Math.sin(b.bob)*3;
    const cx = Math.max(m.l, Math.min(bx, m.r));
    const cy = Math.max(m.t, Math.min(by, m.b));
    const dx = bx - cx, dy = by - cy;

    if (dx*dx + dy*dy < (b.r+2)*(b.r+2)){
      bananas.splice(i,1);
      score += SCORE_BANANA;
      sndBanana();
      popups.push({
        x: bx, y: by,
        t: 0, life: 0.9,
        text: '+' + SCORE_BANANA
      });

      bananaCnt++;
      if (bananaCnt % 2 === 0){
        shield++;
        sndShieldGet();
        popups.push({
          x: MONKEY_X + 40,
          y: GROUND_Y - monkey.y - MONKEY_H - 26,
          t: 0, life: 1.0,
          text: '护盾 +1'
        });
      }
      continue;
    }

    if (b.x < -40) bananas.splice(i,1);
  }

  for (let i=popups.length-1;i>=0;i--){
    const p = popups[i];
    p.t += dt;
    if (p.t >= p.life) popups.splice(i,1);
  }

  if (rainAmt > 0.05){
    const gen = Math.floor(rainAmt * 6) + 2;
    for (let i=0;i<gen;i++){
      rainDrops.push({
        x: Math.random()*(W+140) - 60,
        y: -14,
        vy: 420 + Math.random()*320,
        vx: -90 - Math.random()*70,
        len: 9 + Math.random()*11,
        a: 0.25 + Math.random()*0.45
      });
    }
  }
  for (let i=rainDrops.length-1;i>=0;i--){
    const d = rainDrops[i];
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if (d.y > H + 30 || d.x < -80) rainDrops.splice(i,1);
  }
  if (rainDrops.length > 260) rainDrops.splice(0, rainDrops.length - 260);

  checkCollision();
}

/* ============================================================
   绘制 —— 眼睛激光
   ============================================================ */
function drawEyeLaser(ex, ey, maxLen, phase){
  const now = performance.now() / 1000;
  const flicker = 0.55 + 0.45 * Math.sin(now * 26 + phase * 11);
  const core  = 2.2 + flicker * 2.0;
  const outer = 6 + flicker * 5;
  const wobble = Math.sin(now * 2.6 + phase * 6) * 4;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  /* 外层光晕 */
  ctx.globalAlpha = 0.32 * flicker;
  ctx.strokeStyle = 'rgba(255,40,10,0.9)';
  ctx.lineWidth = outer * 1.9;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex + maxLen, ey + wobble);
  ctx.stroke();

  /* 中层暖光 */
  ctx.globalAlpha = 0.62 * flicker;
  ctx.strokeStyle = 'rgba(255,110,30,0.95)';
  ctx.lineWidth = outer;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex + maxLen, ey + wobble);
  ctx.stroke();

  /* 核心光束 */
  ctx.globalAlpha = 0.95;
  ctx.strokeStyle = 'rgba(255,245,220,1)';
  ctx.lineWidth = core;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex + maxLen, ey + wobble);
  ctx.stroke();

  /* 发射口的小光点 */
  ctx.globalAlpha = 0.85 * flicker;
  ctx.fillStyle = '#FFF6D8';
  ctx.beginPath();
  ctx.arc(ex, ey, core + 1.5, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ============================================================
   绘制 —— 红温变异大猴子
   ============================================================ */
function drawMutatedBody(cx, baseY){
  const fur     = '#C0392B';
  const furDark = '#7B1A1A';
  const face    = '#F5B7A0';
  const dark    = '#2A0000';

  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 90);

  /* 怒气红光 */
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.25 * pulse;
  const grd = ctx.createRadialGradient(cx, baseY - 55, 10, cx, baseY - 55, 110);
  grd.addColorStop(0, 'rgba(255,60,30,.9)');
  grd.addColorStop(1, 'rgba(255,60,30,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(cx, baseY - 55, 110, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  const top = baseY - 92;

  /* 尾巴 */
  ctx.strokeStyle = furDark;
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx - 18, top + 70);
  ctx.bezierCurveTo(cx-52, top+72, cx-56, top+26, cx-26, top+22);
  ctx.stroke();

  /* 腿 */
  ctx.strokeStyle = furDark;
  ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(cx-12, top+68); ctx.lineTo(cx-16, top+82); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+12, top+68); ctx.lineTo(cx+16, top+82); ctx.stroke();

  /* 身体 */
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.ellipse(cx, top+58, 24, 24, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = face;
  ctx.beginPath(); ctx.ellipse(cx+2, top+62, 14, 14, 0, 0, Math.PI*2); ctx.fill();

  /* 耳朵 */
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.arc(cx-26, top+22, 13, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+26, top+22, 13, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = face;
  ctx.beginPath(); ctx.arc(cx-26, top+22, 6.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+26, top+22, 6.5, 0, Math.PI*2); ctx.fill();

  /* 头 */
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.arc(cx, top+26, 26, 0, Math.PI*2); ctx.fill();

  /* 脸 */
  ctx.fillStyle = face;
  ctx.beginPath(); ctx.ellipse(cx+2, top+32, 19, 17, 0, 0, Math.PI*2); ctx.fill();

  /* 怒眉 */
  ctx.strokeStyle = dark;
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx-14, top+20); ctx.lineTo(cx-3, top+26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+14, top+20); ctx.lineTo(cx+3, top+26); ctx.stroke();

  /* 发光红眼 */
  ctx.save();
  ctx.shadowColor = '#FF2000';
  ctx.shadowBlur = 16 + pulse * 12;
  ctx.fillStyle = '#FF2A10';
  ctx.beginPath(); ctx.arc(cx-7, top+31, 4.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+11, top+31, 4.8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#FFE0A0';
  ctx.beginPath(); ctx.arc(cx-7, top+31, 1.7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+11, top+31, 1.7, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  /* ★ 眼睛激光 ★ */
  const laserLen = W - cx + 80;   // 一直射出屏幕右侧
  drawEyeLaser(cx - 7, top + 31, laserLen, 0);
  drawEyeLaser(cx + 11, top + 31, laserLen, 0.17);

  /* 张嘴嚎叫 */
  ctx.fillStyle = '#3A0A0A';
  ctx.beginPath();
  ctx.ellipse(cx+2, top+44, 9, 8, 0, 0, Math.PI*2);
  ctx.fill();

  /* 牙齿 */
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(cx-5, top+38, 3, 5);
  ctx.fillRect(cx+0, top+38, 3, 5);
  ctx.fillRect(cx+5, top+38, 3, 5);
  ctx.fillRect(cx-5, top+49, 3, 4);
  ctx.fillRect(cx+0, top+49, 3, 4);
  ctx.fillRect(cx+5, top+49, 3, 4);

  /* 怒气符号 */
  ctx.save();
  ctx.globalAlpha = 0.6 + 0.4 * pulse;
  ctx.strokeStyle = '#FF3010';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx+20, top-6); ctx.lineTo(cx+28, top+2);
  ctx.moveTo(cx+28, top-6); ctx.lineTo(cx+20, top+2);
  ctx.stroke();
  ctx.restore();
}

function drawMonkeyMutated(){
  const crouch = keys.down && monkey.onGround;
  const cx = MONKEY_X + MONKEY_W/2;
  const baseY = GROUND_Y - monkey.y;

  const t = mutateAnim;

  /* 变异瞬间：白光 + 红环扩散 */
  if (t < 1){
    ctx.save();
    ctx.globalAlpha = (1 - t) * 0.7;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(cx, baseY - 55, 120 + t * 80, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = (1 - t) * 0.8;
    ctx.strokeStyle = '#FF3010';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, baseY - 55, 20 + t * 130, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  /* 0.85 → 1.0 的缩放过渡 */
  const scale = 0.85 + 0.15 * t;

  ctx.save();
  ctx.translate(cx, baseY);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -baseY);

  if (crouch){
    ctx.translate(cx, baseY);
    ctx.scale(1, 0.62);
    ctx.translate(-cx, -baseY);
  }

  drawMutatedBody(cx, baseY);

  ctx.restore();
}

function drawEagle(o, fgS){

  ctx.lineTo(cx - 34, cy + 14);
  ctx.moveTo(cx - 20, cy + 4);
  ctx.lineTo(cx - 34, cy + 4);
  ctx.moveTo(cx - 20, cy + 4);
  ctx.lineTo(cx - 34, cy - 6);
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(cx, cy, 22, 12, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx + 20, cy - 8, 10, 0, Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(cx + 26, cy - 10);
  ctx.lineTo(cx + 42, cy - 6);
  ctx.lineTo(cx + 26, cy - 2);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(cx + 23, cy - 10, 2, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = fgS;
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (up){
    ctx.moveTo(cx - 4, cy - 4);
    ctx.lineTo(cx - 24, cy - 26);
    ctx.lineTo(cx - 2, cy - 22);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx - 4, cy + 4);
    ctx.lineTo(cx - 26, cy + 24);
    ctx.lineTo(cx - 2, cy + 20);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx - 4, cy - 2);
    ctx.lineTo(cx - 26, cy + 6);
    ctx.lineTo(cx - 2, cy + 16);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(cx - 4, cy + 6);
    ctx.lineTo(cx - 26, cy + 20);
    ctx.lineTo(cx - 2, cy + 24);
    ctx.closePath();
    ctx.fill();
  }

  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx + 4, cy + 10);
  ctx.lineTo(cx + 4, cy + 20);
  ctx.moveTo(cx + 10, cy + 10);
  ctx.lineTo(cx + 10, cy + 20);
  ctx.stroke();

  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx + 4, cy + 20);
  ctx.lineTo(cx + 1, cy + 23);
  ctx.moveTo(cx + 4, cy + 20);
  ctx.lineTo(cx + 7, cy + 23);
  ctx.moveTo(cx + 10, cy + 20);
  ctx.lineTo(cx + 7, cy + 23);
  ctx.moveTo(cx + 10, cy + 20);
  ctx.lineTo(cx + 13, cy + 23);
  ctx.stroke();
}

function drawBanana(b){
  const by = b.y + Math.sin(b.bob)*3;

  ctx.save();
  ctx.translate(b.x, by);

  ctx.shadowColor = 'rgba(255,220,80,.85)';
  ctx.shadowBlur  = 14;

  ctx.strokeStyle = '#F7C948';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-8, 6);
  ctx.quadraticCurveTo(-3, -10, 9, -5);
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,240,170,.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-7, 5);
  ctx.quadraticCurveTo(-2, -8, 8, -4);
  ctx.stroke();

  ctx.fillStyle = '#9B7A38';
  ctx.beginPath(); ctx.arc(-8, 6, 2.4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(9, -5, 2.2, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

/* ============================================================
   渲染
   ============================================================ */
function render(){
  let bgC = mixC(DAY_BG, NIGHT_BG, nightT);
  let fgC = mixC(DAY_FG, NIGHT_FG, nightT);

  if (rainAmt > 0.001){
    bgC = mixC(bgC, RAIN_BG, rainAmt);
    fgC = mixC(fgC, RAIN_FG, rainAmt);
  }
  if (bowAmt > 0.001){
    bgC = mixC(bgC, BOW_BG, bowAmt);
    fgC = mixC(fgC, BOW_FG, bowAmt);
  }
  if (mutated){
    bgC = mixC(bgC, [255, 220, 200], 0.55);
    fgC = mixC(fgC, [120, 30, 20], 0.6);
  }

  const bgS = rgbS(bgC);
  const fgS = rgbS(fgC);

  ctx.fillStyle = bgS;
  ctx.fillRect(0, 0, W, H);

  if (bowAmt > 0.02){
    const colors = ['#FF4D4D','#FF9B3D','#FFE44D','#4DD96B','#4DA3FF','#7B5CD6','#C14FD9'];
    const cxr = W/2, cyr = GROUND_Y + 4;
    ctx.save();
    ctx.globalAlpha = bowAmt * 0.55;
    ctx.lineWidth = 6;
    for (let i=0;i<colors.length;i++){
      ctx.strokeStyle = colors[i];
      ctx.beginPath();
      ctx.arc(cxr, cyr, 148 - i*7, Math.PI, Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.globalAlpha = 0.20;
  for (let i=0;i<clouds.length;i++) drawCloud(clouds[i].x, clouds[i].y, fgS);
  ctx.globalAlpha = 1;

  ctx.fillStyle = fgS;
  ctx.globalAlpha = .82;
  ctx.fillRect(0, GROUND_Y, W, 2);
  ctx.globalAlpha = 1;

  ctx.globalAlpha = .30;
  ctx.fillStyle = fgS;
  for (let i=0;i<pebbles.length;i++){
    const p = pebbles[i];
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.w, 1);
  }
  ctx.globalAlpha = 1;

  for (let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    if (o.type !== 'spike') continue;
    drawSpikeShape(o.x + o.w/2, GROUND_Y + 1, o.w, o.h, fgS);
  }

  for (let i=0;i<bananas.length;i++) drawBanana(bananas[i]);

  for (let i=0;i<obstacles.length;i++){
    const o = obstacles[i];
    if (o.type === 'eagle') drawEagle(o, fgS);
  }

  if (mutated){
    drawMonkeyMutated();
  } else {
    if (keys.down && monkey.onGround) drawMonkeyCrouch();
    else                              drawMonkeyStanding();

    if (shield > 0){
      const cx = MONKEY_X + MONKEY_W/2;
      const cy = GROUND_Y - monkey.y -
                 (keys.down && monkey.onGround ? CROUCH_H : MONKEY_H) / 2;
      const t = performance.now() / 200;
      const r = 40 + Math.sin(t) * 2;

      ctx.save();
      ctx.globalAlpha = 0.55 + 0.25 * Math.sin(t * 2);
      ctx.strokeStyle = '#4DA3FF';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.stroke();

      ctx.globalAlpha = 0.12;
      ctx.fillStyle = '#4DA3FF';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.font = '700 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#4DA3FF';
      ctx.fillText('×' + shield, cx, cy - r - 10);
      ctx.restore();
    }
  }

  for (let i=0;i<puffs.length;i++){
    const p = puffs[i];
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a * 0.55;
    ctx.strokeStyle = fgS;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8 + p.t * 90, 0, Math.PI*2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  if (rainDrops.length){
    ctx.save();
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    for (let i=0;i<rainDrops.length;i++){
      const d = rainDrops[i];
      ctx.globalAlpha = d.a * Math.max(rainAmt, 0.3);
      ctx.strokeStyle = '#9fc4e8';
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - d.vx*0.02, d.y - d.len);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 15px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
  for (let i=0;i<popups.length;i++){
    const p = popups[i];
    const a = 1 - p.t/p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.text.indexOf('护盾') >= 0 ? '#4DA3FF' : fgS;
    ctx.fillText(p.text, p.x, p.y - p.t*48);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.font = '700 16px ui-monospace,"SF Mono",Menlo,Consolas,monospace';

  ctx.globalAlpha = .25;
  ctx.fillStyle = fgS;
  ctx.fillText('HI ' + pad5(hiScore), W - 100, 22);

  ctx.globalAlpha = 1;
  ctx.fillText(pad5(score), W - 22, 22);

  if (shield > 0 && !mutated){
    ctx.globalAlpha = 0.8;
    ctx.font = '700 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
    ctx.fillStyle = '#4DA3FF';
    ctx.textAlign = 'right';
    ctx.fillText('护盾 ×' + shield, W - 22, 44);
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (phase === 'ready'){
    ctx.globalAlpha = .45;
    ctx.font = '600 15px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
    ctx.fillStyle = fgS;
    ctx.fillText('按 空 格 开 始', W/2, 84);
    ctx.globalAlpha = 1;
  }

  if (phase === 'over'){
    ctx.globalAlpha = .82;
    ctx.font = '700 24px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
    ctx.fillStyle = fgS;
    ctx.fillText('G A M E   O V E R', W/2, 66);

    if (overTimer > 0.45){
      ctx.globalAlpha = .35 + .25*Math.sin(overTimer*5);
      ctx.font = '600 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
      ctx.fillText('按 空 格 重 来', W/2, 100);
    }
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

/* ============================================================
   主循环
   ============================================================ */
let last = 0;

function loop(now){
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;

  update(dt);
  render();

  document.body.classList.toggle('night',
    !mutated && nightT > 0.5 && rainAmt < 0.5 && bowAmt < 0.5);
  document.body.classList.toggle('rain', rainAmt > 0.5);

  requestAnimationFrame(loop);
}

/* ============================================================
   输入 —— 键盘
   ============================================================ */
function isJumpKey(e){
  const k = e.key, c = e.code, kc = e.keyCode;
  return (
    k === ' ' || k === 'Spacebar' || c === 'Space' ||
    k === 'ArrowUp' || c === 'ArrowUp' ||
    kc === 32 || kc === 38
  );
}
function isCrouchKey(e){
  const k = e.key, c = e.code, kc = e.keyCode;
  return (
    k === 'ArrowDown' || c === 'ArrowDown' ||
    k === 's' || k === 'S' || c === 'KeyS' ||
    kc === 40 || kc === 83
  );
}

function onKeyDown(e){
  if (e.repeat){
    if (isCrouchKey(e)){ keys.down = true; e.preventDefault(); }
    return;
  }
  if (isJumpKey(e)){
    e.preventDefault();
    e.stopPropagation();
    ac();
    ensureRainSound();
    jump();
    return;
  }
  if (isCrouchKey(e)){
    e.preventDefault();
    e.stopPropagation();
    keys.down = true;
    return;
  }
}

function onKeyUp(e){
  if (isCrouchKey(e)){
    e.preventDefault();
    e.stopPropagation();
    keys.down = false;
  }
}

window.addEventListener('keydown', onKeyDown, true);
window.addEventListener('keyup',   onKeyUp,   true);
document.addEventListener('keydown', onKeyDown, true);
document.addEventListener('keyup',   onKeyUp,   true);

/* ============================================================
   输入 —— 鼠标 / 触摸
   ============================================================ */
canvas.addEventListener('pointerdown', function(e){
  e.preventDefault();
  try { canvas.focus(); } catch(err){}
  ac();
  ensureRainSound();
  jump();
});

canvas.addEventListener('touchstart', function(e){
  e.preventDefault();
}, { passive:false });

document.addEventListener('touchmove', function(e){
  e.preventDefault();
}, { passive:false });

window.addEventListener('blur', function(){
  keys.down = false;
});

/* ============================================================
   启动
   ============================================================ */
loadHi();
resetGame(false);
requestAnimationFrame(loop);

})();
</script>
